name: Build Signed APK (arm64)

# 手动触发：Actions → Build Signed APK (arm64) → Run workflow
# 需要在仓库 Settings → Secrets and variables → Actions 里配置 4 个 secret：
#   ANDROID_KEY_BASE64        keystore.b64.txt 的完整内容
#   ANDROID_KEY_ALIAS         hghubx
#   ANDROID_KEYSTORE_PASSWORD 见 secrets.env
#   ANDROID_KEY_PASSWORD      见 secrets.env

on:
  workflow_dispatch:
    inputs:
      target:
        description: "ABI：arm64 手机通用 / armv7 老机 / x86_64 模拟器"
        type: choice
        default: aarch64
        options: [aarch64, armv7, x86_64]
      signed:
        description: "是否用 keystore 签名（关闭则出未签名包）"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"

    steps:
      - uses: actions/checkout@v4

      - name: 安装前端工具链
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK / NDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: 安装 Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 APK
        shell: bash
        run: pnpm tauri android build --apk --split-per-abi --target ${{ inputs.target }}

      - name: 签名 APK
        if: ${{ inputs.signed }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEY_BASE64 secret"; exit 1
          fi
          KS="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/$BT/aapt2"
          mkdir -p artifacts
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk' | grep -v signed); do
            ABI="$(basename "$(dirname "$(dirname "$f")")")"
            OUT="artifacts/HGhubX_${ABI}_signed.apk"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --v4-signing-enabled false \
              --out "$OUT" "$f"
            "$APKSIGNER" verify --print-certs "$OUT" | head -3
            "$AAPT2" dump badging "$OUT" | grep -m1 '^package:'
            echo "signed -> $OUT"
          done
          rm -f "$KS"

      - name: 收集未签名包
        if: ${{ !inputs.signed }}
        shell: bash
        run: |
          mkdir -p artifacts
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            cp "$f" artifacts/
          done
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: hghubx-apk
          path: artifacts/*
          if-no-files-found: error
